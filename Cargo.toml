[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
win95 = { path = "crates/win95" }
gitcore = { path = "crates/gitcore" }
github = { path = "crates/github" }
eframe = { version = "0.36", default-features = false, features = ["glow", "accesskit", "default_fonts", "links"] }
egui = "0.36"
egui_kittest = "0.36"
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
ureq = { version = "3", features = ["json", "platform-verifier"] }
keyring = "4"
rfd = "0.17"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 of downloaded updates (already in the tree through other crates).
sha2 = "0.11"
dirs = "7"
log = "0.4"
notify = "8"
trash = "5"
getrandom = "0.3"
syntect = { version = "5.3", default-features = false, features = ["regex-fancy"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSBundle", "NSError", "NSObject", "NSSet", "NSArray"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotification", "UNNotificationSound", "UNNotificationTrigger"] }
block2 = "0.6"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
# Toasts (already used by eframe's dependencies, same version).
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation"] }
# Redirect locations resolved by RFC 3986 (already in the tree through other crates).
url = "2.5.8"
mockito = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
