name: CI

# Runs only for pull requests into main (build + tests on macOS and Windows) and for
# pushes to main, i.e. merged pull requests (main is protected). Only the latter publish
# a GitHub Release v<major>.<minor from Cargo.toml>.<run number>.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A new commit on a PR cancels its previous run; runs on main always complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      # One OS failing must not cancel the other (the release still needs both).
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
            target: aarch64-apple-darwin
            bin: retrogit
            asset: RetroGit-macos-arm64.zip
          - os: windows-latest
            name: Windows
            target: x86_64-pc-windows-msvc
            bin: retrogit.exe
            asset: RetroGit-windows-x64.zip
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test-output.txt
      - name: Count tests (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # Total of the "N passed" lines, published as the README badge by the release job.
        run: |
          n=$(grep -o 'test result: ok\. [0-9]* passed' test-output.txt | awk '{s+=$4} END {print s}')
          test -n "$n"
          echo "$n" > tests-count.txt
          echo "$n tests passed"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: tests-count
          path: tests-count.txt
          if-no-files-found: error
      - name: Version
        id: version
        shell: bash
        # Same number as the release tag (v<major>.<minor>.<run number>).
        run: |
          base=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "([0-9]+)\.([0-9]+)\..*"/\1.\2/')
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - run: cargo build --release -p retrogit --target ${{ matrix.target }}
        env:
          RETROGIT_VERSION: ${{ steps.version.outputs.version }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$bin" README.md THIRD_PARTY.md dist/
            cd dist
            7z a -tzip "${{ matrix.asset }}" "${{ matrix.bin }}" README.md THIRD_PARTY.md
          else
            scripts/package-macos.sh "$bin" "${{ steps.version.outputs.version }}" dist
          fi
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RETROGIT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc installer\retrogit.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./installer/test-install.ps1 dist\RetroGit-windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: RetroGit-windows-x64-setup.exe
          path: dist/RetroGit-windows-x64-setup.exe
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          base=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "([0-9]+)\.([0-9]+)\..*"/\1.\2/')
          echo "tag=v${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        # Checked by RetroGit before installing an update.
        run: (cd dist && sha256sum RetroGit-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/*.zip dist/*.exe dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "RetroGit ${{ steps.version.outputs.tag }}" \
            --generate-notes
      - uses: actions/download-artifact@v4
        with:
          name: tests-count
          path: badge
      - name: Tests badge
        # shields.io endpoint JSON on the orphan branch `badges` (created on first push).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          n=$(cat badge/tests-count.txt)
          mkdir "$RUNNER_TEMP/badges" && cd "$RUNNER_TEMP/badges"
          git init -q
          git checkout -q -b badges
          printf '{"schemaVersion":1,"label":"tests","message":"%s passed","color":"brightgreen"}\n' "$n" > tests.json
          cat tests.json
          git add tests.json
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "tests badge: $n passed"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" badges
